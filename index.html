    <title>Aave Tracker</title>
    <!-- Apply the theme before paint so the page never flashes the wrong colours. -->
    <script>
      (function () {
        try {
          var v = localStorage.getItem('aave-tracker:theme');
          var dark = v === 'dark' || ((!v || v === 'system') && matchMedia('(prefers-color-scheme: dark)').matches);
          if (dark) document.documentElement.classList.add('dark');
        } catch (e) {}
      })();
    </script>
