name: Daily Aave update

# Source lives on main; the built dashboard and the encrypted data live on
# gh-pages, which GitHub Pages serves. Keeping both in one repository means the
# job can push with the built-in GITHUB_TOKEN and needs no personal token.
#
# gh-pages doubles as the datastore: the updater reads the previous
# portfolio.enc.json from it and writes the new one back, so that file must
# survive while everything else is replaced by the fresh build.

on:
  schedule:
    - cron: "0 1 * * *"   # 01:00 UTC daily
  workflow_dispatch:

permissions:
  contents: write

# Two runs writing to the same branch would race each other.
concurrency:
  group: publish-gh-pages
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: |
          npm install --no-audit --no-fund
          npm --prefix app install --no-audit --no-fund

      - name: Build dashboard
        run: npm --prefix app run build

      - name: Check out published branch
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: site

      - name: Replace the built site, keep the data
        run: |
          # Clear everything the build owns. Naming files one by one leaves
          # stale ones behind once the build output changes -- including font
          # licences that would then sit beside fonts they no longer describe.
          find site -mindepth 1 -maxdepth 1 \
            ! -name .git ! -name portfolio.enc.json -exec rm -rf {} +
          cp -r app/dist/. site/

      - name: Update encrypted portfolio
        env:
          WALLETS: ${{ secrets.WALLETS }}
          RPC_URL: ${{ secrets.RPC_URL }}
          PASSPHRASE: ${{ secrets.PASSPHRASE }}
          OUT_DIR: ${{ github.workspace }}/site
        run: node src/update.js

      - name: Publish
        working-directory: site
        run: |
          # GitHub's own Actions identity. A made-up noreply address such as
          # bot@users.noreply.github.com is NOT anonymous: GitHub reads the
          # legacy <name>@users.noreply.github.com form as a username, and
          # github.com/bot is a real person's account, so these commits were
          # being credited to a stranger. This address belongs to the Actions
          # bot itself, and keeps the daily commits off the owner's graph.
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "data: $(date -u +%F)" || echo "nothing changed"
          git push
